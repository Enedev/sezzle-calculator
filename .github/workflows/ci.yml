name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (go vet, go test, coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.mod

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: go test (internal/ with coverage)
        working-directory: backend
        run: go test ./internal/... -coverprofile=cover.out -covermode=atomic

      - name: Coverage report
        working-directory: backend
        run: go tool cover -func=cover.out | tail -1

      - name: Enforce >=90% coverage on internal/
        working-directory: backend
        run: |
          pct=$(go tool cover -func=cover.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          echo "Total coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p < 90) }' || {
            echo "::error::Coverage ${pct}% is below the 90% gate for internal/"
            exit 1
          }

  frontend:
    name: Frontend (typecheck, lint, vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: sezzle-calculator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
